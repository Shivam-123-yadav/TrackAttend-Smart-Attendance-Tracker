<!-- HIDDEN BUTTON (Mobile Camera Fix) -->
<button id="startCamBtn" class="hidden"></button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('captureBtn');
const status = document.getElementById('status');
const btnText = document.getElementById('btnText');
const btnSpinner = document.getElementById('btnSpinner');

let stream = null;

document.getElementById("employee_select").addEventListener("change", function () {
    document.getElementById("employee_id").value = this.value;
});

// ✅ START CAMERA WITH HD QUALITY (Mobile & Desktop Safe)
async function startCamera() {
    try {
        if (stream) return; // already running

        // HD Camera Settings - 1280x720 minimum
        stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "user",
                width: { ideal: 1920, min: 1280 },
                height: { ideal: 1080, min: 720 },
                aspectRatio: { ideal: 16/9 },
                frameRate: { ideal: 30 }
            },
            audio: false
        });

        video.srcObject = stream;
        
        // Wait for video to be ready
        video.onloadedmetadata = () => {
            video.play();
            // status.innerHTML = `<span class="text-green-600">📹 HD Camera Ready (${video.videoWidth}x${video.videoHeight})</span>`;
        };

    } catch (err) {
        console.error("Camera Error:", err);
        status.innerHTML = `<span class="text-red-600">Camera permission required</span>`;
    }
}

// ✅ REQUIRED FOR MOBILE (Dashboard → Back / Refresh)
document.getElementById("startCamBtn").addEventListener("click", startCamera);

window.addEventListener("pageshow", () => {
    document.getElementById("startCamBtn").click();
});

// ✅ CAPTURE WITH HIGH QUALITY
captureBtn.addEventListener('click', async (e) => {
    e.preventDefault();

    const empId = document.getElementById('employee_id').value.trim();
    if (!empId) {
        alert('Please select an employee');
        return;
    }

    // Check if video is playing
    if (video.videoWidth === 0 || video.videoHeight === 0) {
        status.innerHTML = `<span class="text-red-600">⚠️ Camera not ready. Please wait...</span>`;
        return;
    }

    btnSpinner.classList.remove('hidden');
    btnText.innerText = "Processing...";
    captureBtn.disabled = true;
    captureBtn.classList.add("opacity-50", "cursor-not-allowed");

    // Set canvas to actual video resolution (HD Quality)
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Draw with high quality settings
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Convert to high quality JPEG (0.95 quality = 95%)
    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

    const form = new FormData();
    form.append('employee_id', empId);
    form.append('image', dataUrl);

    fetch('/mark/', {
        method: 'POST',
        body: form,
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
    })
    .then(res => res.json())
    .then(data => {
        status.innerHTML = `<span class="text-green-600">✅ ${data.msg}</span>`;
        // Reload page after 1.5 seconds to show success message
        setTimeout(() => {
            location.reload();
        }, 1500);
    })
    .catch(() => {
        status.innerHTML = `<span class="text-red-600">⚠️ Upload failed</span>`;
    })
    .finally(() => {
        btnSpinner.classList.add('hidden');
        btnText.innerText = "Capture & Mark Attendance";
        captureBtn.disabled = false;
        captureBtn.classList.remove("opacity-50", "cursor-not-allowed");
    });
});
</script>

<style>
video { 
    background: black;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
}
select, button { outline: none !important; }
